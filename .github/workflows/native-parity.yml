name: Native scatter parity

# tests/unit/test_scatter_native.gd (the native rows bit-equal to GDScript's) on Windows and on
# macOS, with the official Godot binary and the libraries native.yml built earlier in the same
# run, debug and release (.github/native/parity.sh). Linux's parity runs in build.yml's test job.
# Called by build.yml beside its test job, and by native.yml on branch runs.
#
# These jobs need the LFS objects since 2026-10-25 (S7b): test_scatter_native builds its maps
# from the built-in core library (libraries/core, GLBs and surface PNGs in Git LFS), and with
# only pointer files checked out the library does not serve ("surface ash albedo: not a PNG"),
# every biome is missing and the test fails (run 40185577349: 0 noise values, 0 placed rows).
# Before that the plans were plain git files and these jobs took no LFS. They restore build.yml's
# LFS cache (key lfs-<hash of the LFS object ids>, cross-OS archive so the Linux test job's entry
# serves Windows and macOS) and `git lfs pull` fetches only what the cache lacks; the first run
# after an LFS change misses (the test job saves at its end) and pulls from LFS bandwidth once
# per job (build.yml's test job explains the LFS budget).
#
# Each job restores and saves its own OS's import of the project from the Actions cache
# (.github/actions/import-cache); the LFS assets import as keep-importer files.

on:
  workflow_call:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows:
    name: Parity Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GODOT_ZIP: Godot_v4.7.2-stable_win64.exe.zip
      GODOT_SHA256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
      GODOT: .ci-godot/Godot_v4.7.2-stable_win64_console.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      # The same cache entry as build.yml's test job (one entry for every OS), so a warm key
      # spends no LFS bandwidth; see the header.
      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true

      - name: Pull LFS objects
        run: git lfs pull

      - name: Download native libraries
        uses: actions/download-artifact@v7
        with:
          pattern: native-windows-*
          path: native
          merge-multiple: true

      - name: Download Godot
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/$env:GODOT_ZIP" -OutFile godot.zip
          if ((Get-FileHash godot.zip -Algorithm SHA256).Hash -ne $env:GODOT_SHA256) { throw "Godot download checksum mismatch" }
          Expand-Archive godot.zip -DestinationPath .ci-godot
          Remove-Item godot.zip

      - name: Restore import cache
        id: import-cache
        uses: ./.github/actions/import-cache
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Import project (import cache ${{ steps.import-cache.outputs.state }})
        run: '"$GODOT" --headless --path . --import'

      - name: Save import cache
        if: steps.import-cache.outputs.state != 'exact'
        uses: actions/cache/save@v4
        with:
          path: .godot/imported
          key: ${{ steps.import-cache.outputs.key }}

      - name: Parity
        run: bash .github/native/parity.sh "$GODOT"

  macos:
    name: Parity macOS
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      GODOT_ZIP: Godot_v4.7.2-stable_macos.universal.zip
      GODOT_SHA256: c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e
      GODOT: .ci-godot/Godot.app/Contents/MacOS/Godot
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      # The same cache entry as build.yml's test job (one entry for every OS), so a warm key
      # spends no LFS bandwidth; see the header.
      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true

      - name: Pull LFS objects
        run: git lfs pull

      - name: Download native libraries
        uses: actions/download-artifact@v7
        with:
          pattern: native-macos-*
          path: native
          merge-multiple: true

      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/$GODOT_ZIP"
          echo "$GODOT_SHA256  godot.zip" | shasum -a 256 -c -
          unzip -q godot.zip -d .ci-godot
          rm godot.zip

      - name: Restore import cache
        id: import-cache
        uses: ./.github/actions/import-cache
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Import project (import cache ${{ steps.import-cache.outputs.state }})
        run: '"$GODOT" --headless --path . --import'

      - name: Save import cache
        if: steps.import-cache.outputs.state != 'exact'
        uses: actions/cache/save@v4
        with:
          path: .godot/imported
          key: ${{ steps.import-cache.outputs.key }}

      # The runner is arm64, so this is the arm64 slice of both Godot and the library.
      - name: Parity (arm64)
        run: bash .github/native/parity.sh "$GODOT"

      # Intel Macs: the x86_64 slices under Rosetta, the release library players load.
      - name: Parity (x86_64 under Rosetta, release library)
        run: PARITY_TARGETS=template_release bash .github/native/parity.sh arch -x86_64 "$GODOT"

      # Context for the parity result on branch runs: whether the engine itself was compiled
      # with contraction (arm64 has fused multiply-add in its baseline; x86_64's needs -mfma).
      - name: Count fused multiply-adds in the Godot binary
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 8
        run: |
          for arch in x86_64 arm64; do
            fused=$(otool -tv -arch "$arch" "$GODOT" | grep -cE '[[:space:]](fn?m(add|sub)|fml[as]|vfn?m(add|sub)[0-9a-z]*)[[:space:]]' || true)
            echo "Godot $arch: $fused fused multiply-add instructions"
          done
