name: Build Godot Project

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"
  PROJECT_NAME: "TTSim"

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            artifact: "TTSim-Windows"
            output: "build/windows/TTSim.exe"
            folder: "build/windows"
          - preset: "macOS"
            artifact: "TTSim-macOS"
            output: "build/macos/TTSim.zip"
            folder: "build/macos"
          - preset: "Linux"
            artifact: "TTSim-Linux"
            output: "build/linux/TTSim.x86_64"
            folder: "build/linux"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable

      - name: Setup export directory
        run: mkdir -p ${{ matrix.folder }}

      - name: Inject version into project
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE_VERSION=$(sed -n 's/config\/version="\([^"]*\)"/\1/p' project.godot)
          if [[ -z "$BASE_VERSION" ]]; then
            echo "ERROR: Could not read version from project.godot"
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${{ github.ref_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [[ "$TAG_VERSION" != "$BASE_VERSION" ]]; then
              echo "ERROR: Tag ${{ github.ref_name }} does not match project.godot version ($BASE_VERSION)"
              exit 1
            fi
            VERSION="$BASE_VERSION"
          else
            VERSION="${BASE_VERSION}-build.$(git rev-parse --short HEAD)"
          fi
          echo "Injecting version: $VERSION"
          sed -i "s/config\/version=\"[^\"]*\"/config\/version=\"$VERSION\"/" project.godot

      - name: Import project
        run: godot --headless --import

      - name: Export ${{ matrix.preset }}
        run: godot --headless --export-release "${{ matrix.preset }}" ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.folder }}/
          retention-days: 14

  sign-windows:
    name: Sign Windows executable
    needs: export
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TTSim-Windows
          path: artifacts/windows

      - name: Sign executable
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}/artifacts/windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload signed Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTSim-Windows-Signed
          path: artifacts/windows/
          retention-days: 14

  sign-macos:
    name: Sign and Notarize macOS
    needs: export
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TTSim-macOS
          path: artifacts/macos

      - name: Extract app bundle
        run: unzip -q artifacts/macos/TTSim.zip -d artifacts/macos/

      - name: Install signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_CI_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign app bundle
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          APP="artifacts/macos/TTSim.app"

          codesign --force --sign "$MACOS_CERTIFICATE_NAME" \
            --options runtime \
            --timestamp \
            --entitlements build/macos/entitlements.plist \
            "$APP/Contents/MacOS/TTSim"

          codesign --force --sign "$MACOS_CERTIFICATE_NAME" \
            --options runtime \
            --timestamp \
            --entitlements build/macos/entitlements.plist \
            "$APP"

          codesign --verify --verbose "$APP"

      - name: Create zip for notarization
        run: ditto -c -k --keepParent artifacts/macos/TTSim.app artifacts/macos/TTSim-notarize.zip

      - name: Notarize
        env:
          MACOS_NOTARIZATION_API_KEY: ${{ secrets.MACOS_NOTARIZATION_API_KEY }}
          MACOS_NOTARIZATION_API_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_API_KEY_ID }}
          MACOS_NOTARIZATION_API_ISSUER: ${{ secrets.MACOS_NOTARIZATION_API_ISSUER }}
        run: |
          API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          echo -n "$MACOS_NOTARIZATION_API_KEY" | base64 --decode > "$API_KEY_PATH"

          SUBMISSION_ID=$(xcrun notarytool submit artifacts/macos/TTSim-notarize.zip \
            --key "$API_KEY_PATH" \
            --key-id "$MACOS_NOTARIZATION_API_KEY_ID" \
            --issuer "$MACOS_NOTARIZATION_API_ISSUER" \
            --output-format json | jq -r '.id')
          echo "Submission ID: $SUBMISSION_ID"

          TIMEOUT=1800
          ELAPSED=0
          INTERVAL=30
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
              --key "$API_KEY_PATH" \
              --key-id "$MACOS_NOTARIZATION_API_KEY_ID" \
              --issuer "$MACOS_NOTARIZATION_API_ISSUER" \
              --output-format json | jq -r '.status')
            echo "Status: $STATUS (${ELAPSED}s elapsed)"
            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization accepted."
              break
            elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$API_KEY_PATH" \
                --key-id "$MACOS_NOTARIZATION_API_KEY_ID" \
                --issuer "$MACOS_NOTARIZATION_API_ISSUER"
              rm "$API_KEY_PATH"
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Notarization timed out after ${TIMEOUT}s. Submission ID: $SUBMISSION_ID"
            rm "$API_KEY_PATH"
            exit 1
          fi

          rm "$API_KEY_PATH"

      - name: Staple notarization ticket
        run: xcrun stapler staple artifacts/macos/TTSim.app

      - name: Verify notarization
        run: spctl -a -vvv -t install artifacts/macos/TTSim.app

      - name: Repackage signed app
        run: ditto -c -k --keepParent artifacts/macos/TTSim.app artifacts/macos/TTSim.zip

      - name: Upload signed macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTSim-macOS-Signed
          path: artifacts/macos/TTSim.zip
          retention-days: 14

  release:
    name: Create Release
    needs: [export, sign-windows, sign-macos]
    if: always() && needs.export.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact (signed, tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: TTSim-Windows-Signed
          path: artifacts/windows

      - name: Download Windows artifact (unsigned, pre-release builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/download-artifact@v4
        with:
          name: TTSim-Windows
          path: artifacts/windows

      - name: Download macOS artifact (signed, tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: TTSim-macOS-Signed
          path: artifacts/macos

      - name: Download macOS artifact (unsigned, pre-release builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/download-artifact@v4
        with:
          name: TTSim-macOS
          path: artifacts/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: TTSim-Linux
          path: artifacts/linux

      - name: Prepare release assets
        run: |
          cd artifacts/windows && zip -r ../../TTSim-Windows.zip . && cd ../..
          mv artifacts/macos/TTSim.zip TTSim-macOS.zip
          cd artifacts/linux && zip -r ../../TTSim-Linux.zip . && cd ../..

      - name: Get version info
        id: version
        run: |
          BASE_VERSION=$(sed -n 's/config\/version="\([^"]*\)"/\1/p' project.godot)
          if [[ -z "$BASE_VERSION" ]]; then
            echo "ERROR: Could not read version from project.godot"
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "version=${BASE_VERSION}" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "version=${BASE_VERSION}-build.${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "tag_name=v${BASE_VERSION}-build.${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_tag == 'true' && steps.version.outputs.version || format('Build {0}', steps.version.outputs.version) }}
          body: |
            ${{ steps.version.outputs.is_tag == 'true' && format('## Release {0}', steps.version.outputs.version) || 'Automated build from commit' }}

            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            ${{ steps.version.outputs.is_tag != 'true' && format('**Branch:** `{0}`', github.ref_name) || '' }}
          files: |
            TTSim-Windows.zip
            TTSim-macOS.zip
            TTSim-Linux.zip
          prerelease: ${{ steps.version.outputs.is_tag != 'true' }}
