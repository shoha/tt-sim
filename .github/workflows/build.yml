name: Build Godot Project

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"
  PROJECT_NAME: "TTSim"

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            artifact: "TTSim-Windows"
            output: "build/windows/TTSim.exe"
            folder: "build/windows"
          - preset: "macOS"
            artifact: "TTSim-macOS"
            output: "build/macos/TTSim.zip"
            folder: "build/macos"
          - preset: "Linux"
            artifact: "TTSim-Linux"
            output: "build/linux/TTSim.x86_64"
            folder: "build/linux"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable

      - name: Setup export directory
        run: mkdir -p ${{ matrix.folder }}

      - name: Inject version into project
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE_VERSION=$(sed -n 's/config\/version="\([^"]*\)"/\1/p' project.godot)
          if [[ -z "$BASE_VERSION" ]]; then
            echo "ERROR: Could not read version from project.godot"
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${{ github.ref_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [[ "$TAG_VERSION" != "$BASE_VERSION" ]]; then
              echo "ERROR: Tag ${{ github.ref_name }} does not match project.godot version ($BASE_VERSION)"
              exit 1
            fi
            VERSION="$BASE_VERSION"
          else
            VERSION="${BASE_VERSION}-build.$(git rev-parse --short HEAD)"
          fi
          echo "Injecting version: $VERSION"
          sed -i "s/config\/version=\"[^\"]*\"/config\/version=\"$VERSION\"/" project.godot

      - name: Import project
        run: godot --headless --import

      - name: Export ${{ matrix.preset }}
        run: godot --headless --export-release "${{ matrix.preset }}" ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.folder }}/
          retention-days: 14

  release:
    name: Create Release
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TTSim-Windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TTSim-macOS
          path: artifacts/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: TTSim-Linux
          path: artifacts/linux

      - name: Prepare release assets
        run: |
          cd artifacts/windows && zip -r ../../TTSim-Windows.zip . && cd ../..
          mv artifacts/macos/TTSim.zip TTSim-macOS.zip
          cd artifacts/linux && zip -r ../../TTSim-Linux.zip . && cd ../..

      - name: Get version info
        id: version
        run: |
          BASE_VERSION=$(sed -n 's/config\/version="\([^"]*\)"/\1/p' project.godot)
          if [[ -z "$BASE_VERSION" ]]; then
            echo "ERROR: Could not read version from project.godot"
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "version=${BASE_VERSION}" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "version=${BASE_VERSION}-build.${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "tag_name=v${BASE_VERSION}-build.${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_tag == 'true' && steps.version.outputs.version || format('Build {0}', steps.version.outputs.version) }}
          body: |
            ${{ steps.version.outputs.is_tag == 'true' && format('## Release {0}', steps.version.outputs.version) || 'Automated build from commit' }}

            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            ${{ steps.version.outputs.is_tag != 'true' && format('**Branch:** `{0}`', github.ref_name) || '' }}
          files: |
            TTSim-Windows.zip
            TTSim-macOS.zip
            TTSim-Linux.zip
          prerelease: ${{ steps.version.outputs.is_tag != 'true' }}
